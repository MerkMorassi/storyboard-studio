
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Media Analysis Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Global error handler to catch any script loading or early runtime errors
      // that might prevent React from rendering its ErrorBoundary.
      window.onerror = function (message, source, lineno, colno, error) {
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = `
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: #2a0000; color: #ffcccc; padding: 20px;
          font-family: monospace; font-size: 14px; z-index: 99999;
          overflow: auto; border: 5px solid #ff0000; box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
        `;
        errorDiv.innerHTML = `
          <h1 style="color: #ff6666; font-size: 24px; margin-bottom: 15px;">Critical Application Error</h1>
          <p style="margin-bottom: 10px;">Please take a screenshot and report this issue.</p>
          <pre style="background: #000000; padding: 15px; border-radius: 5px; width: 80%; max-width: 600px; white-space: pre-wrap; word-break: break-word;">
            <strong>Message:</strong> ${message}<br>
            <strong>Source:</strong> ${source} (Line: ${lineno}, Col: ${colno})<br>
            <strong>Error:</strong> ${error ? error.stack : 'No stack trace available'}
          </pre>
          <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #ff6666; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            Reload Page
          </button>
        `;
        document.body.appendChild(errorDiv);
        return true; // Prevent default browser error reporting
      };

      window.onunhandledrejection = function (event) {
        const error = event.reason;
        const message = error instanceof Error ? error.message : String(error);
        const stack = error instanceof Error ? error.stack : 'No stack trace available';
        const errorDiv = document.createElement('div');
        errorDiv.style.cssText = `
          position: fixed; top: 0; left: 0; width: 100%; height: 100%;
          background: #2a0000; color: #ffcccc; padding: 20px;
          font-family: monospace; font-size: 14px; z-index: 99999;
          overflow: auto; border: 5px solid #ff0000; box-sizing: border-box;
          display: flex; flex-direction: column; align-items: center; justify-content: center;
        `;
        errorDiv.innerHTML = `
          <h1 style="color: #ff6666; font-size: 24px; margin-bottom: 15px;">Unhandled Promise Rejection</h1>
          <p style="margin-bottom: 10px;">An asynchronous operation failed. Please take a screenshot and report this issue.</p>
          <pre style="background: #000000; padding: 15px; border-radius: 5px; width: 80%; max-width: 600px; white-space: pre-wrap; word-break: break-word;">
            <strong>Reason:</strong> ${message}<br>
            <strong>Stack:</strong> ${stack}
          </pre>
          <button onclick="window.location.reload()" style="margin-top: 20px; padding: 10px 20px; background: #ff6666; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px;">
            Reload Page
          </button>
        `;
        document.body.appendChild(errorDiv);
        event.preventDefault(); // Prevent default browser error reporting
      };

      // This config object defines the entire color palette and theme.
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: '#1a1a1a', // Main background color
              secondary: '#2a2a2a', // Panel and sidebar backgrounds
              accent: '#3a3a3a', // Borders, dividers, and subtle backgrounds
              'text-primary': '#e0e0e0', // Primary text color
              'text-secondary': '#b0b0b0', // Secondary/muted text color
              brand: '#52525b', // Buttons, interactive elements, focus rings
              'brand-hover': '#71717a', // Hover state for brand color elements
            },
          },
        },
      };
    </script>
    <style>
      /* General styles for a clean, modern look */
      body {
        background-color: #1a1a1a; /* Corresponds to 'bg-primary' */
        color: #e0e0e0; /* Corresponds to 'text-text-primary' */
      }

      /* Custom Scrollbar Styling */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent; 
      }
      ::-webkit-scrollbar-thumb {
        background-color: #3a3a3a; /* accent */
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: #52525b; /* brand */
      }
      ::-webkit-scrollbar-corner {
        background: transparent;
      }

      /* Firefox */
      * {
        scrollbar-width: thin;
        scrollbar-color: #3a3a3a transparent;
      }
    </style>

{

    "url": "https://esm.sh/url@^0.11.4",
    "@huggingface/inference": "https://esm.sh/@huggingface/inference@^4.13.5"
  }
}
</script>
